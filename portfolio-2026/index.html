<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- .ico first for Safari and older browsers, PNG for everything modern -->
    <link rel="icon" href="/icon.png" sizes="48x48" />
    <link rel="icon" type="image/png" href="/icon.png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xavier Gelligan | Portfolio</title>

    <!--
      Apply the saved theme before first paint so a light-mode visitor never
      sees a flash of the dark palette. Mirrors src/util/useTheme.ts.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("xg-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
